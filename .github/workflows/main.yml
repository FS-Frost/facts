name: Deploy to GitHub Pages

on:
    push:
        branches:
            - master

jobs:
    test-build-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4

            - name: Use Bun
              uses: oven-sh/setup-bun@v2

            - name: Install
              run: |
                  bun install --frozen-lockfile

            - name: Run tests
              run: |
                  bun run test

            - name: Build 🔧
              run: |
                  bun run build

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: dist
