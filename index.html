<!DOCTYPE html>

        <meta charset="utf-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
        <meta name="description" content="Random facts" />
        <link rel="apple-touch-icon" href="/facts/logo192.png" />
        <link rel="manifest" href="/facts/manifest.json" />

        <!-- Apply the saved theme before first paint to avoid a light flash. Keep in sync with useTheme. -->
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem("theme");
                    var isDark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    document.documentElement.classList.toggle("dark", isDark);
                } catch (e) {}
            })();
        </script>

        <title>Facts</title>

    </body>
</html>
